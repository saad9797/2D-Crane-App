# Render Blueprint: one API web service + one static site. The database lives on Neon (not in this file).
# Deploy: Render dashboard -> New -> Blueprint -> pick this repository. Then fill the variables marked
# "sync: false" (see README, "Deploying to Render + Neon").
services:
  - type: web
    name: crane-api
    runtime: node
    plan: free
    region: frankfurt
    # Free web services have no pre-deploy hook, so migrations and the demo seed run as part of the build.
    # `migrate deploy` uses DIRECT_URL (Neon's non-pooled string); the running server uses the pooled DATABASE_URL.
    buildCommand: >-
      npm ci --include=dev -w @crane/api -w @crane/shared &&
      npm run build -w @crane/api &&
      npm run db:deploy -w @crane/api &&
      npm run db:seed -w @crane/api
    startCommand: npm run start -w @crane/api
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: 1
      - key: LOG_LEVEL
        value: info
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: BCRYPT_COST
        value: 12
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL # Neon POOLED connection string (host contains "-pooler")
        sync: false
      - key: DIRECT_URL # Neon DIRECT connection string (no "-pooler"), used only by migrations/seed
        sync: false
      - key: CORS_ORIGINS # the static site's URL, e.g. https://crane-web.onrender.com (no trailing slash)
        sync: false

  - type: web
    name: crane-web
    runtime: static
    buildCommand: npm ci --include=dev -w @crane/web -w @crane/shared && npm run build -w @crane/web
    staticPublishPath: apps/web/dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_API_URL # the API service's URL, e.g. https://crane-api.onrender.com (no trailing slash)
        sync: false
    routes:
      # single-page app: every path serves index.html so /design/abc123 survives a refresh
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
